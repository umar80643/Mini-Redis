[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="miniredis-engine"
version="1.0.0"
description="Async RESP-compatible in-memory data store"
requires-python=">=3.12"
dependencies=["prometheus-client>=0.20","pydantic>=2.7","pydantic-settings>=2.2"]
[project.optional-dependencies]
dev=["pytest>=8","pytest-asyncio>=0.23","hypothesis>=6","ruff>=0.5","black>=24","mypy>=1.10"]
[project.scripts]
miniredis="miniredis.main:main"
[tool.setuptools.packages.find]
include=["miniredis*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
testpaths=["tests"]
[tool.black]
line-length=100
[tool.ruff]
line-length=100

[tool.mypy]
python_version="3.12"
ignore_missing_imports=true
check_untyped_defs=true
plugins=["pydantic.mypy"]

[tool.ruff.lint]
select=["E","F","I","B"]
ignore=["E501","E701","E702"]
